variables:
  - template: /eng/common-variables.yml@self
  - template: /eng/common/templates-official/variables/pool-providers.yml@self
  - name: LinuxImage
    value: build.azurelinux.3.amd64
  - name: WindowsImage
    value: 1es-windows-2022

trigger:
  batch: true
  branches:
    include:
    - dotnet/main
    - dotnet/release/*

pr: none

resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      tsa:
        enabled: true
      policheck:
        enabled: true
        exclusionsFile: $(Build.SourcesDirectory)\.config\PoliCheckExclusions.xml
      binskim:
        scanOutputDirectoryOnly: true
    pool:
      name: $(DncEngInternalBuildPool)
      image: $(WindowsImage)
      os: windows
    containers:
      webassembly:
        image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-cross-amd64
      android:
        image: mcr.microsoft.com/dotnet-buildtools/prereqs:azurelinux-3.0-net11.0-cross-android-amd64
    stages:
    - stage: build
      displayName: Build
      jobs:
      - template: /eng/common/templates-official/jobs/jobs.yml@self
        parameters:
          enablePublishBuildArtifacts: true
          enablePublishBuildAssets: true
          enablePublishUsingPipelines: true
          jobs:

          ############ BROWSER BUILD ############
          - job: Build_Browser
            displayName: Browser
            timeoutInMinutes: 360
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(LinuxImage)
              os: linux
            container: webassembly
            steps:
            - bash: |
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Browser /p:TargetArchitecture=wasm $(_InternalBuildArgs)
              displayName: Build
            templateContext:
              outputs:
              - output: pipelineArtifact
                targetPath: $(System.DefaultWorkingDirectory)/artifacts/bin
                artifactName: Artifacts_Browser

          - job: Build_Browser_Threading
            displayName: Browser_Threading
            timeoutInMinutes: 360
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(LinuxImage)
              os: linux
            container: webassembly
            steps:
            - bash: |
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Browser /p:TargetArchitecture=wasm /p:WasmEnableThreads=true $(_InternalBuildArgs)
              displayName: Build
            templateContext:
              outputs:
              - output: pipelineArtifact
                targetPath: $(System.DefaultWorkingDirectory)/artifacts/bin
                artifactName: Artifacts_Browser_Threading

          ############ WASI BUILD ############
          - job: Build_Wasi
            displayName: Wasi
            timeoutInMinutes: 360
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(LinuxImage)
              os: linux
            container: webassembly
            steps:
            - bash: |
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Wasi /p:TargetArchitecture=wasm $(_InternalBuildArgs)
              displayName: Build
            templateContext:
              outputs:
              - output: pipelineArtifact
                targetPath: $(System.DefaultWorkingDirectory)/artifacts/bin
                artifactName: Artifacts_Wasi

          - job: Build_Wasi_Threading
            displayName: Wasi_Threading
            timeoutInMinutes: 360
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(LinuxImage)
              os: linux
            container: webassembly
            steps:
            - bash: |
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Wasi /p:TargetArchitecture=wasm /p:WasmEnableThreads=true $(_InternalBuildArgs)
              displayName: Build
            templateContext:
              outputs:
              - output: pipelineArtifact
                targetPath: $(System.DefaultWorkingDirectory)/artifacts/bin
                artifactName: Artifacts_Wasi_Threading

          ############ Android BUILD ############
          - job: Build_Android
            displayName: Android
            timeoutInMinutes: 360
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(LinuxImage)
              os: linux
            container: android
            variables:
            - name: Codeql.BuildIdentifier
              value: ado_android
            - name: Codeql.Cadence
              value: 72
            - name: Codeql.Enabled
              value: true
            - name: Codeql.Language
              value: cpp,java,python
            - name: Codeql.TSAEnabled
              value: true
            steps:
            - bash: |
                mkdir which-shim
                echo '#!/bin/sh' > which-shim/which
                echo 'command -v "$@"' >> which-shim/which
                chmod +x which-shim/which
                echo "##vso[task.prependpath]$PWD/which-shim"
              displayName: Add a which shim for CodeQL
              condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dotnet/main'))
            - task: CodeQL3000Init@0
              displayName: Initialize ADO CodeQL
              condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dotnet/main'))
            - bash: python3 -m compileall -q eng/common/cross/install-debs.py
              displayName: Compile Python sources
              condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dotnet/main'))
            - bash: |
                echo 'public class helloworld { public static void main(String[] args) { System.out.println("Hello world"); } }' > helloworld.java
                javac helloworld.java
                java helloworld
              displayName: Run java helloworld
            - bash: |
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Android /p:TargetArchitecture=x64 $(_InternalBuildArgs)
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Android /p:TargetArchitecture=x86 $(_InternalBuildArgs)
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Android /p:TargetArchitecture=arm64 $(_InternalBuildArgs)
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Android /p:TargetArchitecture=arm $(_InternalBuildArgs)
              displayName: Build
            - task: CodeQL3000Finalize@0
              displayName: Finalize ADO CodeQL
              condition: and(succeededOrFailed(), eq(variables['Build.SourceBranch'], 'refs/heads/dotnet/main'))
            templateContext:
              outputs:
              - output: pipelineArtifact
                targetPath: $(System.DefaultWorkingDirectory)/artifacts/bin
                artifactName: Artifacts_Android

          - job: CodeQL_GitHub
            displayName: CodeQL GitHub
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dotnet/main'))
            timeoutInMinutes: 360
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(LinuxImage)
              os: linux
            container: android
            variables:
            - name: Codeql.BuildIdentifier
              value: github_android
            - name: Codeql.Cadence
              value: 72
            - name: Codeql.Enabled
              value: true
            - name: Codeql.Language
              value: cpp,java,python
            - name: Codeql.ADO.Build.Repository.Provider
              value: override
            - name: Codeql.ADO.Build.Repository.Uri
              value: https://github.com/dotnet/icu
            - name: skipComponentGovernanceDetection
              value: true
            steps:
            - bash: |
                mkdir which-shim
                echo '#!/bin/sh' > which-shim/which
                echo 'command -v "$@"' >> which-shim/which
                chmod +x which-shim/which
                echo "##vso[task.prependpath]$PWD/which-shim"
              displayName: Add a which shim for CodeQL
            - task: CodeQL3000Init@0
              displayName: Initialize GitHub CodeQL
            - bash: python3 -m compileall -q eng/common/cross/install-debs.py
              displayName: Compile Python sources
            - bash: |
                echo 'public class helloworld { public static void main(String[] args) { System.out.println("Hello world"); } }' > helloworld.java
                javac helloworld.java
                java helloworld
              displayName: Run java helloworld
            - bash: |
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Android /p:TargetArchitecture=x64 $(_InternalBuildArgs)
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Android /p:TargetArchitecture=x86 $(_InternalBuildArgs)
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Android /p:TargetArchitecture=arm64 $(_InternalBuildArgs)
                ./build.sh --ci --restore --build --configuration $(_BuildConfig) /p:TargetOS=Android /p:TargetArchitecture=arm $(_InternalBuildArgs)
              displayName: Build
            - task: CodeQL3000Finalize@0
              displayName: Finalize GitHub CodeQL
              condition: succeededOrFailed()

          ############ PACK AND PUBLISH ############
          - job: Publish_Packages
            displayName: Publish packages
            dependsOn:
            - Build_Browser
            - Build_Browser_Threading
            - Build_Wasi
            - Build_Wasi_Threading
            - Build_Android
            timeoutInMinutes: 360
            pool:
              name: $(DncEngInternalBuildPool)
              image: $(WindowsImage)
              os: windows
            steps:
            - task: DownloadPipelineArtifact@2
              inputs:
                artifact: Artifacts_Browser
                path: 'artifacts/bin'
            - task: DownloadPipelineArtifact@2
              inputs:
                artifact: Artifacts_Browser_Threading
                path: 'artifacts/bin/browser-threading'
            - task: DownloadPipelineArtifact@2
              inputs:
                artifact: Artifacts_Wasi
                path: 'artifacts/bin'
            - task: DownloadPipelineArtifact@2
              inputs:
                artifact: Artifacts_Wasi_Threading
                path: 'artifacts/bin/wasi-threading'
            - task: DownloadPipelineArtifact@2
              inputs:
                artifact: Artifacts_Android
                path: 'artifacts/bin'
            - powershell: |
                .\eng\common\build.ps1 -ci -restore -pack -publish -configuration $(_BuildConfig) -projects $(Build.SourcesDirectory)\eng\icu.proj /p:PackOnly=true $(_InternalBuildArgs)
              displayName: Pack and Publish packages

    ############ POST BUILD ARCADE LOGIC ############
    - template: /eng/common/templates-official/post-build/post-build.yml@self
      parameters:
        enableSourceLinkValidation: false
        enableSigningValidation: false
        enableSymbolValidation: false
        enableNugetValidation: true
